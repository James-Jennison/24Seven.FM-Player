<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>24Seven.FM</title>
    <link rel="stylesheet" href="receiver-landscape-v1.css" />
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  </head>
  <body>
    <cast-media-player></cast-media-player>
    <main id="receiver-experience" hidden aria-live="polite">
      <section class="now-playing-card">
        <div class="artwork-frame">
          <img id="now-playing-artwork" alt="Current track artwork" />
        </div>
        <div class="now-playing-copy">
          <p class="eyebrow">NOW PLAYING</p>
          <h1 id="now-playing-title">Live radio</h1>
          <p id="now-playing-station">24Seven.FM</p>
          <span class="live-indicator"><i></i> LIVE</span>
        </div>
      </section>
    </main>
    <script src="receiver-landscape-v2.js"></script>
  </body>
</html>
