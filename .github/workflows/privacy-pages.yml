name: Project Site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Prepare canonical privacy and project artwork
        run: ./scripts/prepare-project-site.sh

      - name: Build Pages site with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./privacy-site
          destination: ./_site

      - name: Stage public Tester Task metadata
        run: sudo install -m 0644 privacy-site/_data/tester_tasks.json _site/assets/tester-tasks.json

      - name: Validate dedicated-domain artifact
        run: |
          node --check privacy-site/assets/project.js
          node --check privacy-site/assets/theme-init.js
          node --check privacy-site/assets/private-tester-queue.js
          python3 scripts/validate-tester-tasks.py
          node scripts/test-private-tester-queue.mjs
          node scripts/test-tester-portal.mjs
          python3 scripts/validate-project-site.py _site

      - name: Prepare temporary GitHub Pages transition
        run: ./scripts/prepare-pages-transition.sh _pages-transition

      - name: Validate GitHub Pages transition
        run: python3 scripts/validate-pages-transition.py _pages-transition

      - name: Upload approved transition artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./_pages-transition
