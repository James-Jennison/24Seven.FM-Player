<!doctype html>
<html lang="en">
  <head>
    {% include site-head.html %}
  </head>
  <body class="page page-{{ page.section | default: 'overview' }}" data-page-section="{{ page.section }}">
    {% include site-header.html section=page.section %}
    <main id="main-content">
      {{ content }}
    </main>
    {% include site-footer.html %}
    {% if page.section == 'overview' %}{% include software-structured-data.html %}{% endif %}
    <script src="{{ '/assets/project.js' | relative_url }}?v={{ asset_version }}" defer></script>
  </body>
</html>
