<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Live Chat — Coordinator Avery Cole</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body class="tester-preview">
    <main class="chat-popout-shell">
      <article class="window messages-window">
        <header class="window-header"><span class="window-dot cyan"></span><h1>Live Chat</h1><span class="secure-label">⌑ Private</span></header>
        <section class="thread">
          <div class="thread-meta"><div><span class="status-dot"></span><strong>Coordinator Avery Cole</strong><small>Assigned 24Seven.FM Player coordinator · local sample identity</small></div></div>
          <div class="messages" data-tester-popout-messages aria-live="polite"><article class="message admin"><strong>Coordinator Avery Cole</strong><div>Your onboarding is complete. Your first active test is ready when you are.</div><small>Today · delivered</small></article><article class="message"><strong>You</strong><div>Thank you — I’m ready to begin.</div><small>Today</small></article></div>
          <form class="chat-composer" data-tester-popout-form><label class="visually-hidden" for="tester-popout-message">Write a private message</label><input id="tester-popout-message" maxlength="500" autocomplete="off" placeholder="Write a message…"><button class="button primary" type="submit">Send</button></form>
        </section>
      </article>
    </main>
    <script src="./tester-chat-popout.js"></script>
  </body>
</html>
