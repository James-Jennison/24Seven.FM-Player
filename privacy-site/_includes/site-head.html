<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09070f">
<meta name="color-scheme" content="dark light">
{% include metadata.html %}
<title>{{ page.title | default: site.title | escape }}</title>
<link rel="icon" type="image/png" href="{{ '/assets/project/app-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
{% assign asset_version = site.time | date: '%s' %}
<link rel="preload" href="{{ '/assets/fonts/InstrumentSerif-Regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/InstrumentSans-Variable.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<script src="{{ '/assets/theme-init.js' | relative_url }}?v={{ asset_version }}"></script>
<link rel="stylesheet" href="{{ '/assets/project.css' | relative_url }}?v={{ asset_version }}">
